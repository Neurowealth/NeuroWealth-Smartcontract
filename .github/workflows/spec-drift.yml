name: Contract Spec Drift Detection

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "neurowealth-vault/**"
      - "contracts/**"
      - "scripts/generate-spec.py"
      - "scripts/validate-spec.py"
      - "contract-spec.json"

jobs:
  spec-drift:
    name: Spec drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.11"

      - name: Generate fresh contract spec
        run: |
          python3 scripts/generate-spec.py

      - name: Validate spec
        run: |
          python3 scripts/validate-spec.py

      - name: Fail if contract-spec.json changed
        run: |
          if ! git diff --quiet -- contract-spec.json; then
            echo "contract-spec.json is out of date with the contract source."
            echo "Run: python3 scripts/generate-spec.py and commit the updated file."
            git --no-pager diff -- contract-spec.json
            exit 1
          else
            echo "contract-spec.json is up-to-date"
          fi
