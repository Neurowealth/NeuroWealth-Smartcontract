name: DB Schema Drift Detection

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "supabase/migrations/**"
      - "db/schema.sql"
      - "db/types.ts"
      - "scripts/check-schema-drift.py"

jobs:
  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.11"

      - name: Check db/types.ts against supabase/migrations
        run: |
          python3 scripts/check-schema-drift.py
