name: CI

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

env:
  # Maximum allowed size in bytes for the optimised contract WASM.
  # Raise this in the same PR as any deliberate feature addition that grows
  # the binary, and document the reason in the PR description.
  WASM_SIZE_LIMIT_BYTES: 1500000

jobs:
  # Secret scan (#605, #766): fails the build if any commit in the PR (or
  # push) introduces a Stellar secret seed, .env contents, or anything else
  # the gitleaks ruleset in .gitleaks.toml matches, or if a committed env
  # template / key file breaks scripts/check-env-templates.py. Full history is fetched so
  # every commit in the range is scanned, not just the merge result.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Ensure no committed node_modules (#909)
        run: bash scripts/check-no-committed-node-modules.sh

      - name: Env templates & key files policy (#766)
        run: python3 scripts/check-env-templates.py

      - name: Production defaults policy (#820)
        run: python3 scripts/check-no-production-defaults.py

      # The gitleaks CLI is used directly (pinned + checksum-verified) rather
      # than gitleaks-action, which requires a paid GITLEAKS_LICENSE on
      # organization-owned repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history)
        run: gitleaks git --redact -v --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore .

  # Public function auth gate (#908): verifies that every public Soroban
  # contract entrypoint enforces an explicit authorization check or is documented
  # as an unauthenticated/read-only query.
  pub-fn-auth-gate:
    name: Public Function Auth Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Verify public function authorization gate (#908)
        run: bash scripts/check-pub-fn-auth.sh

  # Lockfile integrity check (#918): enforces that package-lock.json matches
  # package.json exactly across all packages in the repository.
  lockfile-integrity:
    name: Lockfile Integrity (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Root"
            dir: "."
            lockfile: "package-lock.json"
          - name: "Frontend"
            dir: "frontend"
            lockfile: "frontend/package-lock.json"
          - name: "Agent"
            dir: "agent"
            lockfile: "agent/package-lock.json"
          - name: "WhatsApp"
            dir: "whatsapp"
            lockfile: "whatsapp/package-lock.json"
          - name: "Vault Client"
            dir: "packages/vault-client"
            lockfile: "packages/vault-client/package-lock.json"
          - name: "Vault UI"
            dir: "packages/vault-ui"
            lockfile: "packages/vault-ui/package-lock.json"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Verify lockfile integrity (npm ci) (#918)
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts



  ci-matrix:
    name: CI Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Format Check"
            step: "fmt"
            working_directory: "neurowealth-vault"
          - name: "Clippy Lint"
            step: "clippy"
            working_directory: "neurowealth-vault"
          - name: "Tests"
            step: "test"
            working_directory: "neurowealth-vault"
          - name: "Documentation Check"
            step: "doc"
            working_directory: "neurowealth-vault"
          - name: "Vault Client Typecheck"
            step: "vault-client-typecheck"
            working_directory: "packages/vault-client"
          - name: "Vault UI Accessibility & Notifications"
            step: "vault-ui-test"
            working_directory: "packages/vault-ui"
          - name: "Frontend Typecheck, Lint, Test & Build"
            step: "frontend-check"
            working_directory: "frontend"
          - name: "Agent Typecheck, Lint & Tests"
            step: "agent-check"
            working_directory: "agent"
          - name: "WhatsApp Typecheck & Tests"
            step: "whatsapp-check"
            working_directory: "whatsapp"
          - name: "Bridge Typecheck & Tests"
            step: "bridge-check"
            working_directory: "packages/bridge"
          - name: "Monitoring Typecheck & Tests"
            step: "monitoring-check"
            working_directory: "packages/monitoring"
          - name: "Admin Panel Lint & Build"
            step: "admin-panel-check"
            working_directory: "packages/admin-panel"
          - name: "Build WASM"
            step: "build-wasm"
            working_directory: "neurowealth-vault"
          - name: "No Bare Panic Check"
            step: "no-bare-panic"
            working_directory: "."
          - name: "Stale-State Audit Check"
            step: "stale-state-audit"
            working_directory: "."

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read Stellar CLI version
        id: cli-version
        run: |
          VERSION=$(cat .stellar-version | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain with components
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: neurowealth-vault

      - name: Cache cargo registry and tooling
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.local/bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        if: matrix.step == 'build-wasm'
        run: |
          VERSION="${{ steps.cli-version.outputs.version }}"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Install wasm-opt
        if: matrix.step == 'build-wasm'
        run: cargo install wasm-opt --locked

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.working_directory }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/neurowealth-target
        run: |
          set -euo pipefail
          case "${{ matrix.step }}" in
            fmt)
              cargo fmt --all -- --check
              ;;
            clippy)
              cargo clippy --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic
              ;;
            test)
              cargo test --verbose
              ;;
            doc)
              RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
              ;;
            vault-client-typecheck)
              npm ci --prefix ../..
              npm run typecheck --prefix ../.. --workspace=@neurowealth/vault-client
              npm test --prefix ../.. --workspace=@neurowealth/vault-client
              ;;
            vault-ui-test)
              npm ci --prefix ../..
              npm test --prefix ../.. --workspace=@neurowealth/vault-ui
              ;;
            frontend-check|frontend-lint)
              npm ci
              npm run typecheck
              npm run lint
              npm test
              npm run build
              ;;
            agent-check)
              npm ci
              npm run typecheck
              npm run lint
              npm test
              npm run build
              ;;
            whatsapp-check)
              npm ci
              npm test
              ;;
            bridge-check)
              # Depends on @neurowealth/vault-client via a file: reference
              # (#998), so its dist/ must exist before `npm ci` here can
              # resolve real type declarations rather than failing module
              # resolution.
              (cd ../vault-client && npm ci && npm run build)
              npm ci
              npm run typecheck
              npm test
              ;;
            monitoring-check)
              (cd ../vault-client && npm ci && npm run build)
              npm ci
              npm run typecheck
              npm test
              ;;
            admin-panel-check)
              (cd ../vault-client && npm ci && npm run build)
              npm ci
              npm run lint
              npm run build
              ;;
            build-wasm)
              RUSTFLAGS="-C target-cpu=mvp" cargo build \
                -p neurowealth-vault \
                --target wasm32-unknown-unknown \
                --release

              WASM_DIR="${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release"
              WASM_FILE="$WASM_DIR/neurowealth_vault.wasm"
              wasm-opt --strip-target-features \
                "$WASM_FILE" \
                -o "$WASM_FILE"

              WASM_SIZE=$(stat -c%s "$WASM_FILE")
              LIMIT="${WASM_SIZE_LIMIT_BYTES:-1500000}"
              BASE_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
              BASELINE_FILE=".github/wasm-size-history.json"
              BASELINE_SOURCE_FILE="$BASELINE_FILE"
              BASELINE_SIZE=""
              DELTA_BYTES=""
              DELTA_DISPLAY="n/a"

              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                git fetch origin "$BASE_BRANCH" --depth=1 >/dev/null 2>&1 || true
                if git show "origin/$BASE_BRANCH:$BASELINE_SOURCE_FILE" > "$RUNNER_TEMP/wasm-size-baseline.json" 2>/dev/null; then
                  BASELINE_FILE="$RUNNER_TEMP/wasm-size-baseline.json"
                else
                  BASELINE_FILE="$BASELINE_SOURCE_FILE"
                fi
              fi

              if [ -f "$BASELINE_FILE" ]; then
                BASELINE_SIZE=$(python3 - "$BASELINE_FILE" "$BASE_BRANCH" -c "import json, sys; path, branch = sys.argv[1], sys.argv[2]; data = json.load(open(path)) if open(path) else {}; entry = data.get(branch, {}).get('latest'); print(entry.get('size_bytes', '') if entry else '')")
              fi

              if [ -n "$BASELINE_SIZE" ]; then
                DELTA_BYTES=$((WASM_SIZE - BASELINE_SIZE))
                if [ "$DELTA_BYTES" -gt 0 ]; then
                  DELTA_DISPLAY="+$DELTA_BYTES bytes"
                elif [ "$DELTA_BYTES" -lt 0 ]; then
                  DELTA_DISPLAY="$DELTA_BYTES bytes"
                else
                  DELTA_DISPLAY="0 bytes"
                fi
              fi

              {
                echo "## WASM Size Report"
                echo ""
                echo "| Metric | Value |"
                echo "|--------|-------|"
                echo "| Optimised size | ${WASM_SIZE} bytes |"
                echo "| Limit          | ${LIMIT} bytes |"
                if [ -n "$BASELINE_SIZE" ]; then
                  echo "| Baseline (${BASE_BRANCH}) | ${BASELINE_SIZE} bytes |"
                  echo "| Delta vs ${BASE_BRANCH} | ${DELTA_DISPLAY} |"
                else
                  echo "| Baseline (${BASE_BRANCH}) | n/a |"
                  echo "| Delta vs ${BASE_BRANCH} | n/a |"
                fi
              } >> "$GITHUB_STEP_SUMMARY"

              if [ "$WASM_SIZE" -gt "$LIMIT" ]; then
                echo "| Status | :x: EXCEEDED |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Optimised WASM is ${WASM_SIZE} bytes, which exceeds the ${LIMIT}-byte limit. See docs/WASM_SIZE.md for reduction tips."
                exit 1
              else
                echo "| Status | :white_check_mark: OK |" >> "$GITHUB_STEP_SUMMARY"
                echo "Optimised WASM is ${WASM_SIZE} bytes — within the ${LIMIT}-byte limit."
              fi

              if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "develop" ]; }; then
                python3 scripts/update_wasm_baseline.py "$WASM_SIZE" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$BASELINE_FILE"
              fi

              # Validate storage layout compatibility gate
              mkdir -p scripts/e2e-artifacts
              python3 scripts/check-storage-layout.py \
                "$WASM_FILE" \
                "$WASM_FILE" \
                --migration-doc docs/UPGRADE_MIGRATION.md \
                --output scripts/e2e-artifacts/storage_layout_diff.txt

              # Export the WASM path for the artifact upload step.
              echo "WASM_FILE=$WASM_FILE" >> "$GITHUB_ENV"
              ;;
            no-bare-panic)
              bash scripts/check-no-bare-panic.sh \
                neurowealth-vault/contracts/vault/src
              ;;
            stale-state-audit)
              bash scripts/check-stale-state-audit.sh \
                neurowealth-vault/contracts/vault/src/lib.rs
              ;;
            *)
              echo "Unknown step: ${{ matrix.step }}" >&2
              exit 1
              ;;
          esac

      - name: Upload optimised WASM artifact
        if: matrix.step == 'build-wasm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neurowealth-vault-wasm
          path: ${{ env.WASM_FILE }}
          retention-days: 14

  package-checks:
    name: Package checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: admin-panel
            workspace: "@neurowealth/admin-panel"
          - package: bridge
            workspace: "@neurowealth/bridge"
          - package: monitoring
            workspace: "@neurowealth/monitoring"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build vault-client workspace
        run: npm run build --workspace=@neurowealth/vault-client

      - name: Typecheck ${{ matrix.package }}
        run: npm run typecheck --workspace=${{ matrix.workspace }}

      - name: Test ${{ matrix.package }}
        run: npm test --workspace=${{ matrix.workspace }}

  frontend-e2e:
    name: Frontend Vault Journey Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-vault-journey-failure-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  kani-share-math:
    name: Kani Share-Accounting Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          args: --manifest-path neurowealth-vault/Cargo.toml -p share-math

  cargo-deny:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # The workflow-level weekly cron (Sunday 03:00 UTC) re-runs this job
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@10d8902cf9225c404574ce39c45d5d26c3047464
        with:
          command: check
          # The vault workspace manifest drives the dependency graph.
          manifest-path: ./neurowealth-vault/Cargo.toml
          # Policy lives in deny.toml at the repo root (auto-discovered by cargo-deny).
          # Respect the [graph] settings in deny.toml instead of forcing
          # --all-features (the action's default).
          arguments: ""

      - name: Open or update advisory tracking issue
        # Only scheduled runs manage the tracking issue: a per-PR failure is
        # already visible on the PR itself, while a scheduled failure has no
        # PR to surface it and would otherwise go unnoticed.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = 'Scheduled cargo-deny audit is failing (dependency advisory drift)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly scheduled `cargo deny check` run failed, meaning a new',
              'RustSec advisory (or license/ban/source violation) now applies to the',
              'pinned dependency graph even though no PR has touched it.',
              '',
              `- Failing run: ${runUrl}`,
              '- Policy: `deny.toml` (workspace: `neurowealth-vault/Cargo.toml`)',
              '',
              'Triage: inspect the run log for the advisory ID, then either upgrade',
              'the affected dependency or record a justified exception in',
              '`deny.toml`. Close this issue once a scheduled run passes again.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of the latest scheduled run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  reproducible-build:
    name: Reproducible Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Two clean uncached builds are expensive, so this runs where an
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      # No build caches on purpose: a reproducibility attestation must come
      # from two genuinely clean builds.
      - name: Dual build + hash comparison
        run: bash scripts/check-reproducible-build.sh

  readme-check:
    name: README Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate README
        run: bash scripts/check-readme.sh .

  # i18n key parity (#932): every frontend locale catalog (en, es, fr, ja, pt,
  # zh) must define exactly the keys in messages/en.json, and the locale lists
  # in i18n/request.ts and middleware.ts must match the catalogs on disk.
  i18n-parity:
    name: Frontend i18n Key Parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check locale catalogs for missing/extra keys
        run: python3 scripts/check-i18n-parity.py

  security-audit:
    name: Security Documentation Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate contract specification (#919)
        run: python3 scripts/validate-spec.py

      - name: Verify access control table accuracy (spec)
        run: bash scripts/check-access-control.sh

      - name: Verify auth matrix against source (lib.rs)
        run: python3 scripts/check-auth-matrix.py

      - name: Soroban pitfall lints (storage unwrap / init / auth)
        run: python3 scripts/check-soroban-lints.py

      - name: Verify DataKey::Balance deprecation
        run: bash scripts/check-balance-deprecation.sh

      - name: Verify DataKey docs match lib.rs
        run: bash scripts/check-data-key-docs.sh

      - name: Verify every test_*.rs file is registered in tests/mod.rs
        run: bash scripts/check-test-registration.sh

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      vault_src: ${{ steps.filter.outputs.vault_src }}
      share_math: ${{ steps.filter.outputs.share_math }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check for contract changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            contract:
              - 'neurowealth-vault/**'
            vault_src:
              - 'neurowealth-vault/contracts/vault/src/**'
            share_math:
              - 'neurowealth-vault/share-math/**'

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [changes]
    # Note: All 9 fuzz targets run in CI. Runtime considerations:
    # - PR: 9 targets × 120s = ~18 minutes total (parallelized)
    # - Scheduled: 9 targets × 300s = ~45 minutes total (parallelized)
    # The timeout-minutes: 10 applies per target, not per matrix.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.vault_src == 'true')
    strategy:
      fail-fast: false
      matrix:
        target:
          - deposit_withdraw_sequence
          - rebalance_transitions
          - rounding_boundaries
          - share_accounting_invariants
          - agent_update_timelock
          - admin_timelock_interleaved
          - harvest_sequence
          - upgrade_timelock
          - user_strategy
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: neurowealth-vault

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} fuzz target (PR – short bounds)
        if: github.event_name == 'pull_request'
        working-directory: neurowealth-vault
        run: cargo fuzz run ${{ matrix.target }} -- -runs=1000 -max_total_time=120

      - name: Run ${{ matrix.target }} fuzz target (scheduled – full bounds)
        if: github.event_name == 'schedule'
        working-directory: neurowealth-vault
        run: cargo fuzz run ${{ matrix.target }} -- -runs=5000 -max_total_time=300

  # Withdrawal-queue share accounting (#777). Fuzzes the pure share-math
  # queue model from its own standalone cargo-fuzz project, so it builds
  # without the Soroban contract crate.
  fuzz-withdrawal-queue:
    name: Fuzz withdrawal_queue_invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.share_math == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: neurowealth-vault/share-math/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Stable randomized invariant test
        working-directory: neurowealth-vault
        run: cargo test -p share-math queue

      - name: Run fuzz target (PR – short bounds)
        if: github.event_name == 'pull_request'
        working-directory: neurowealth-vault
        run: cargo fuzz run --fuzz-dir share-math/fuzz withdrawal_queue_invariants -- -max_total_time=120

      - name: Run fuzz target (scheduled / manual – full bounds)
        if: github.event_name != 'pull_request'
        working-directory: neurowealth-vault
        run: cargo fuzz run --fuzz-dir share-math/fuzz withdrawal_queue_invariants -- -max_total_time=600

  e2e-devnet:
    name: E2E Devnet Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [ci-matrix, changes]
    # Trigger e2e-devnet on manual dispatch, weekly schedule, or PRs with 'run-e2e' label or contract modifications
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
        needs.changes.outputs.contract == 'true'
      ))

    # Required secrets:
    # - SOROBAN_SECRET_KEY: Funded Stellar account secret key used by E2E script
    #                       to deploy and interact with the contracts on testnet.
    env:
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read Stellar CLI version
        id: cli-version
        run: |
          VERSION=$(cat .stellar-version | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: neurowealth-vault

      - name: Install Stellar CLI
        run: |
          VERSION="${{ steps.cli-version.outputs.version }}"
          if [[ -x "$HOME/.local/bin/stellar" ]]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            stellar --version
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      - name: Build contract WASM (MVP-compatible)
        working-directory: neurowealth-vault
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/neurowealth-target
        run: |
          RUSTFLAGS="-C target-cpu=mvp" cargo build \
            -p neurowealth-vault \
            --target wasm32-unknown-unknown \
            --release

          WASM_DIR="${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release"
          WASM_FILE="$WASM_DIR/neurowealth_vault.wasm"
          wasm-opt --strip-target-features \
            "$WASM_FILE" \
            -o "$WASM_FILE"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Run E2E devnet validation
        id: e2e
        run: |
          echo "::group::E2E Output"
          ./scripts/e2e-devnet.sh 2>&1 | tee scripts/e2e-artifacts/full_output.log
          echo "::endgroup::"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-devnet-artifacts
          path: scripts/e2e-artifacts/
          retention-days: 14

      - name: Cleanup testnet state
        if: always()
        run: ./scripts/e2e-restore.sh --keep-artifacts

      - name: Report failure details
        if: failure()
        run: |
          echo "## E2E Devnet Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/summary.txt ]]; then
            echo "### Scenario Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scripts/e2e-artifacts/summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/contract_id.txt ]]; then
            CID=$(cat scripts/e2e-artifacts/contract_id.txt)
            echo "### References" >> $GITHUB_STEP_SUMMARY
            echo "- **Contract ID:** \`$CID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Explorer:** [View on StellarExpert](https://stellar.expert/explorer/testnet/contract/$CID)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded **e2e-devnet-artifacts** for full logs and transaction details." >> $GITHUB_STEP_SUMMARY

      - name: Report success details
        if: success()
        run: |
          echo "## E2E Devnet Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/summary.txt ]]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scripts/e2e-artifacts/summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [[ -f scripts/e2e-artifacts/contract_id.txt ]]; then
            CID=$(cat scripts/e2e-artifacts/contract_id.txt)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Contract ID:** \`$CID\`" >> $GITHUB_STEP_SUMMARY
          fi

  arithmetic-guard:
    name: Arithmetic overflow guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy

      - name: Cache cargo registry & build artefacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Layer (a): Clippy forbids bare integer arithmetic operators.
      # -D turns the lint into a hard error; the build fails if any violation
      # is found.  This runs on ALL features so test helpers are also covered.
      - name: Clippy — forbid integer_arithmetic
        working-directory: neurowealth-vault/contracts/vault
        run: |
          cargo clippy \
            --all-features \
            -- \
            -D clippy::integer_arithmetic

      # Layer (b): Shell grep sweep for patterns Clippy can miss.
      # Checks:
      #   - No source-level #[allow(clippy::integer_arithmetic)] suppression
      #   - No .checked_*().unwrap() (must use .expect("msg"))
      #   - No silent 'as i128 / as u64 …' truncating casts in contract source
      - name: Shell arithmetic sweep
        working-directory: neurowealth-vault/contracts/vault
        run: bash scripts/check_arithmetic.sh

      # Summary is written to the GitHub Actions step summary by the script.
