\* TLC model-checker configuration for TimelockStateMachines.tla (Issue #592).
\*
\* Bounded model: MaxLedger=6, Delay=3, Values={v1,v2} keeps the reachable
\* state space small enough for exhaustive (not sampled) TLC breadth-first
\* search to complete in seconds, while Delay < MaxLedger guarantees both
\* the "before expiry" and "at/after expiry" regions of the ledger clock are
\* actually explored for every schedule action, which is the region the
\* safety property is about. Values has 2 elements so "propose A, ledger
\* advances, propose a DIFFERENT value B after a cancel" sequences are
\* reachable and exercised (see CancelAgentUpdate/CancelUpgrade -> re-Schedule).

SPECIFICATION Spec

CONSTANTS
    MaxLedger = 6
    Delay = 3
    v1 = v1
    v2 = v2
    Values = {v1, v2}
    none = none
    NoValue = none

INVARIANTS
    TypeOK
    AgentNoEarlyApply
    UpgradeNoEarlyApply
    NonInterference
    VersionMonotonic
    LedgerMonotonic

CHECK_DEADLOCK FALSE
